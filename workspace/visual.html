<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ULTRON</title>
<style>
:root{--c:#5ff2e6;--p:#9a5cff;--bg:#02030a;--ink:#c4fbff;--dim:#6aa8b0;--line:rgba(95,242,230,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 Consolas,"SF Mono",ui-monospace,monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
header{position:fixed;top:3vh;left:0;right:0;text-align:center;pointer-events:none;transition:opacity 1s}
h1{font-size:clamp(26px,4.2vw,62px);letter-spacing:.7em;margin-right:-.7em;font-weight:400;color:var(--c);text-shadow:0 0 28px rgba(95,242,230,.55)}
header small{letter-spacing:.5em;color:var(--dim);font-size:11px}
.side{position:fixed;top:17vh;width:min(26vw,350px);display:flex;flex-direction:column;gap:14px;transition:opacity 1s ease,transform 1s ease}
.l{left:3vw}.r{right:3vw}
body.focus .side{opacity:0;pointer-events:none}
body.focus .l{transform:translateX(-48px)}
body.focus .r{transform:translateX(48px)}
body.focus header{opacity:.22}
.panel{background:rgba(8,10,30,.55);border:1px solid var(--line);padding:14px 16px;backdrop-filter:blur(6px)}
.panel h2{font-size:12px;letter-spacing:.25em;font-weight:400;color:var(--c);border-bottom:1px solid rgba(95,242,230,.22);padding-bottom:6px;margin-bottom:10px}
.row{display:grid;grid-template-columns:42px 1fr 44px;gap:10px;align-items:center;color:var(--dim);margin:6px 0}
.row b{font-weight:400;text-align:right;color:var(--ink)}
.bar{height:8px;background:rgba(255,255,255,.07)}
.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .6s}
#clock{font-size:30px;color:var(--c);letter-spacing:.08em;margin-top:10px}
#date{color:var(--dim);font-size:12px;letter-spacing:.15em}
.list{color:var(--ink);white-space:pre-wrap}
#tr,#act{max-height:26vh;overflow:hidden;display:flex;flex-direction:column;gap:6px}
#tr p span{color:var(--c)}#tr p.u span{color:var(--p)}
#act p{color:var(--dim)}
#cap{position:fixed;left:50%;bottom:17vh;transform:translateX(-50%);width:min(72vw,900px);text-align:center;font-size:clamp(16px,2vw,28px);line-height:1.45;color:var(--ink);text-shadow:0 0 18px rgba(95,242,230,.5);opacity:0;transition:opacity .6s;pointer-events:none}
#cap.on{opacity:1}
#status{position:fixed;left:0;right:0;bottom:11vh;text-align:center;letter-spacing:.6em;color:var(--c);font-size:12px;pointer-events:none}
#bar{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);width:min(900px,88vw);border:1px solid var(--line);background:rgba(8,10,30,.6);backdrop-filter:blur(6px);transition:opacity .8s}
body.focus #bar{opacity:.35}
body.focus #bar:focus-within{opacity:1}
#in{width:100%;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px;padding:14px 18px}
#in::placeholder{color:var(--dim)}
#bar:focus-within{border-color:var(--c);box-shadow:0 0 22px rgba(95,242,230,.25)}
@media(max-width:900px){.side{display:none}}
@media(prefers-reduced-motion:reduce){.side,header,#cap,#bar{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1>ULTRON</h1><small>DEEP COGNITIVE CORE AGENT</small></header>

<div class="side l">
  <section class="panel"><h2>SYSTEM</h2>
    <div class="row">CPU<div class="bar"><i id="b-cpu"></i></div><b id="v-cpu">--</b></div>
    <div class="row">MEM<div class="bar"><i id="b-mem"></i></div><b id="v-mem">--</b></div>
    <div class="row">PWR<div class="bar"><i id="b-pwr"></i></div><b id="v-pwr">--</b></div>
    <div id="clock">00:00:00</div><div id="date"></div>
  </section>
  <section class="panel"><h2>WORKSPACE</h2><div class="list" id="ws">main.py
agent.py
memory.md
.env
skills/</div></section>
  <section class="panel"><h2>SKILLS</h2><div class="list" id="sk">none loaded</div></section>
</div>

<div class="side r">
  <section class="panel"><h2>TRANSCRIPT</h2><div id="tr"></div></section>
  <section class="panel"><h2>ACTIVITY</h2><div id="act"></div></section>
</div>

<div id="cap"></div>
<div id="status">ONLINE</div>
<div id="bar"><input id="in" autocomplete="off" autofocus placeholder="Type, or press Tab to talk…  Enter sends, Esc cancels"></div>

<script>
/* ---------- config ---------- */
const CONFIG = {
  ws: null,        // e.g. "ws://localhost:8765/ws"  (backend drives state + levels)
  endpoint: null   // e.g. "/chat"  POST {text} -> {reply, audio_url?}
};

const $ = s => document.querySelector(s);
const BANDS = 24;

/* ---------- canvas ---------- */
const cv = $('#c'), g = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#02030a'; g.fillRect(0, 0, W, H);
}
addEventListener('resize', resize); resize();

const MODES = {
  idle:      {h1:176, h2:262, spin:.08, amp:.06, glow:.55, size:.23},
  listening: {h1:182, h2:205, spin:.14, amp:.30, glow:.95, size:.33},
  thinking:  {h1:272, h2:305, spin:.95, amp:.10, glow:.85, size:.30},
  speaking:  {h1:196, h2:288, spin:.22, amp:.34, glow:1.15, size:.34}
};
const cur = {...MODES.idle};

const N = 2600, P = [];
for (let i = 0; i < N; i++){
  const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), a = i * 2.399963;
  P.push({x:Math.cos(a)*r, y, z:Math.sin(a)*r, ph:Math.random()*6.283,
          b:Math.min(BANDS-1, Math.floor((1-Math.abs(y))*BANDS*.8 + Math.random()*BANDS*.2))});
}

/* ---------- audio ---------- */
let AC, micA, outA, micStream, playing = false;
let ext = 0, lastExt = 0;
const spec = new Float32Array(BANDS), tmp = new Float32Array(BANDS), fb = new Uint8Array(256);
let e = 0, pe = 0;

function ensureAC(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    outA = mkAn(); outA.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
}
function mkAn(){ const a = AC.createAnalyser(); a.fftSize = 512; a.smoothingTimeConstant = .7; return a; }
function readA(a){
  a.getByteFrequencyData(fb);
  let s = 0;
  for (let i = 0; i < BANDS; i++){
    const lo = Math.floor(2 * Math.pow(1.17, i)), hi = Math.max(lo + 1, Math.floor(2 * Math.pow(1.17, i + 1)));
    let m = 0; for (let j = lo; j < hi && j < 256; j++) m += fb[j];
    m /= (hi - lo) * 255; tmp[i] = m; s += m;
  }
  return s / BANDS;
}
function audio(dt, t){
  let lv = 0; tmp.fill(0);
  if (mode === 'listening' && micA){
    lv = Math.min(1, readA(micA) * 2.4);
    for (let i = 0; i < BANDS; i++) tmp[i] = Math.min(1, tmp[i] * 2.4);
  } else if (mode === 'speaking'){
    if (playing && outA){
      lv = Math.min(1, readA(outA) * 1.8);
      for (let i = 0; i < BANDS; i++) tmp[i] = Math.min(1, tmp[i] * 1.8);
    } else {
      ext *= Math.exp(-dt * 5);
      let v = ext;
      if (performance.now() - lastExt > 600) v = Math.max(v, .30 + .2 * Math.sin(t*7.3) * Math.sin(t*2.9 + 1));
      lv = v;
      for (let i = 0; i < BANDS; i++) tmp[i] = v * (.55 + .45 * Math.sin(t*5 + i*.7));
    }
  } else if (mode === 'thinking'){
    lv = .1; for (let i = 0; i < BANDS; i++) tmp[i] = .12 * (.5 + .5 * Math.sin(t*4 + i));
  } else {
    lv = .04; for (let i = 0; i < BANDS; i++) tmp[i] = .05 * (.5 + .5 * Math.sin(t*1.2 + i*.5));
  }
  const k = 1 - Math.exp(-dt * 14);
  for (let i = 0; i < BANDS; i++) spec[i] += (tmp[i] - spec[i]) * k;
  pe = e; e += (lv - e) * k;
}

/* ---------- render ---------- */
const ripples = []; let lastRip = 0;
let t = 0, last = performance.now(), ry = 0;

function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const kk = 1 - Math.exp(-dt * 2.6);
  for (const k in cur) cur[k] += (MODES[mode][k] - cur[k]) * kk;
  audio(dt, t);

  g.globalCompositeOperation = 'source-over';
  g.fillStyle = 'rgba(2,3,10,.30)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';

  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * cur.size * (1 + e * .12) * (1 + Math.sin(t * .8) * .012);

  // halo
  let gr = g.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.9);
  gr.addColorStop(0, `hsla(${cur.h2},90%,55%,${.10 * cur.glow + e * .14})`);
  gr.addColorStop(.5, `hsla(${cur.h1},90%,55%,${.05 * cur.glow})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  // particles
  ry += cur.spin * dt;
  const rx = .38 + .1 * Math.sin(t * .2);
  const cY = Math.cos(ry), sY = Math.sin(ry), cX = Math.cos(rx), sX = Math.sin(rx);
  for (let i = 0; i < N; i++){
    const p = P[i], sp = spec[p.b];
    const d = 1 + cur.amp * (Math.sin(t*2.2 + p.ph*3 + p.y*4) * .5 + .5) * (e * 2 + .15) + sp * cur.amp * 2.2;
    const x = p.x * d, y = p.y * d, z = p.z * d;
    const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
    const y1 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;
    const s = 3 / (3 - z2), df = (z2 + 1) / 2;
    const hue = cur.h1 + (cur.h2 - cur.h1) * Math.min(1, (p.y + 1) / 2 * .7 + p.ph / 6.283 * .3);
    const a = (.22 + .78 * df) * (.6 + .4 * Math.sin(t * 3 + p.ph * 9)) * (.7 + sp * 1.2);
    const sz = (.7 + 1.5 * df) * (1 + sp * 1.6) * s;
    g.fillStyle = `hsla(${hue},95%,${58 + sp * 32}%,${Math.min(1, a)})`;
    g.fillRect(cx + x1 * R * s - sz / 2, cy + y1 * R * s - sz / 2, sz, sz);
  }

  // core
  const cr = R * (.26 + e * .28);
  gr = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 2.2);
  gr.addColorStop(0, `rgba(255,255,255,${.55 + e * .4})`);
  gr.addColorStop(.25, `hsla(${cur.h1},100%,75%,${.45 * cur.glow})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, cr * 2.2, 0, 6.283); g.fill();

  // ripples on voice peaks
  if (e > .18 && e - pe > .04 && t - lastRip > .2){ ripples.push({r:0}); lastRip = t; }
  for (let i = ripples.length - 1; i >= 0; i--){
    const rp = ripples[i]; rp.r += dt * .8;
    if (rp.r > 1){ ripples.splice(i, 1); continue; }
    g.strokeStyle = `hsla(${cur.h2},95%,70%,${(1 - rp.r) * .5})`; g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, R * (1.05 + rp.r * .9), 0, 6.283); g.stroke();
  }

  // orbit rings
  for (let i = 0; i < 3; i++){
    g.save(); g.translate(cx, cy);
    g.rotate(t * (.05 + i * .03) * (i % 2 ? -1 : 1) + i * 1.1);
    g.scale(1, .26 + .12 * i);
    g.beginPath(); g.arc(0, 0, R * (1.3 + i * .2) * (1 + e * .04), 0, 6.283);
    g.setLineDash([2, 10 + i * 6]); g.lineDashOffset = -t * 20 * (i + 1);
    g.strokeStyle = `hsla(${cur.h1},90%,65%,${.18 + e * .5})`; g.lineWidth = 1.2; g.stroke();
    g.restore();
  }
  g.setLineDash([]);

  // thinking sweep
  if (mode === 'thinking'){
    g.strokeStyle = `hsla(${cur.h2},100%,75%,.8)`; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, R * 1.14, t * 4, t * 4 + 1.1); g.stroke();
  }
  requestAnimationFrame(frame);
}

/* ---------- state + ui ---------- */
let mode = 'idle', focusT, capT, abort = null;
const LABEL = {idle:'ONLINE', listening:'LISTENING', thinking:'PROCESSING', speaking:'SPEAKING'};

function setMode(m){
  mode = m; clearTimeout(focusT);
  $('#status').textContent = LABEL[m] || m.toUpperCase();
  if (m !== 'idle') document.body.classList.add('focus');
  else focusT = setTimeout(() => { if (mode === 'idle') document.body.classList.remove('focus'); }, 4000);
}
function cap(text, ms){
  const c = $('#cap'); c.textContent = text; c.classList.add('on');
  clearTimeout(capT); if (ms) capT = setTimeout(() => c.classList.remove('on'), ms);
}
function log(role, text){
  const p = document.createElement('p'); p.className = role === 'you' ? 'u' : '';
  const s = document.createElement('span'); s.textContent = (role === 'you' ? 'you' : 'ultron') + '  ';
  p.append(s, text); const tr = $('#tr'); tr.append(p);
  while (tr.children.length > 6) tr.firstChild.remove();
}
function act(text){
  const p = document.createElement('p');
  p.textContent = new Date().toTimeString().slice(0, 8) + '  ' + text;
  const a = $('#act'); a.append(p);
  while (a.children.length > 8) a.firstChild.remove();
}
function stats(d){
  for (const k of ['cpu', 'mem', 'pwr']) if (d[k] != null){
    $('#b-' + k).style.width = d[k] + '%'; $('#v-' + k).textContent = Math.round(d[k]) + '%';
  }
}
function tick(){
  const n = new Date();
  $('#clock').textContent = n.toTimeString().slice(0, 8);
  $('#date').textContent = n.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
}
setInterval(tick, 1000); tick();

/* ---------- mic + speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, heard = '';
async function startMic(){
  try{
    ensureAC();
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    micA = mkAn(); AC.createMediaStreamSource(micStream).connect(micA);
    heard = ''; setMode('listening'); cap('Listening…');
    if (SR){
      rec = new SR(); rec.interimResults = true; rec.lang = 'en-US';
      rec.onresult = ev => { heard = ''; for (const r of ev.results) heard += r[0].transcript; cap(heard); };
      rec.onend = () => { if (mode === 'listening'){ const txt = heard.trim(); stopMic(); txt ? ask(txt) : (setMode('idle'), cap('', 1)); } };
      rec.start();
    } else cap('Speech to text is not supported in this browser. Use the text box.', 4000);
  }catch(err){ act('mic error: ' + err.message); setMode('idle'); }
}
function stopMic(){
  if (micStream) micStream.getTracks().forEach(tr => tr.stop());
  micStream = null; micA = null;
  if (rec){ rec.onend = null; try{ rec.stop(); }catch(_){} rec = null; }
}

/* ---------- talk to backend ---------- */
let ws = null;
function connect(){
  if (!CONFIG.ws) return;
  ws = new WebSocket(CONFIG.ws);
  ws.onopen = () => act('backend connected');
  ws.onmessage = m => {
    const d = JSON.parse(m.data);
    if (d.type === 'state') setMode(d.state);
    else if (d.type === 'level'){ ext = Math.max(ext, d.v); lastExt = performance.now(); }
    else if (d.type === 'transcript'){ log(d.role, d.text); if (d.role !== 'you') cap(d.text); }
    else if (d.type === 'activity') act(d.text);
    else if (d.type === 'stats') stats(d);
    else if (d.type === 'workspace') $('#ws').textContent = d.items.join('\n');
    else if (d.type === 'skills') $('#sk').textContent = d.items.join('\n') || 'none loaded';
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

async function ask(text){
  log('you', text); cap(text); setMode('thinking');
  abort = new AbortController();
  try{
    if (ws && ws.readyState === 1){ ws.send(JSON.stringify({type:'user', text})); return; }
    if (CONFIG.endpoint){
      const r = await fetch(CONFIG.endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text}), signal:abort.signal});
      const j = await r.json(); return reply(j.reply, j.audio_url);
    }
    await new Promise(r => setTimeout(r, 900));
    reply('Demo mode. No backend connected. I heard: ' + text);
  }catch(err){ if (err.name !== 'AbortError'){ act('error: ' + err.message); setMode('idle'); } }
}
function reply(text, url){
  log('ultron', text); cap(text);
  if (url) playUrl(url); else speakText(text);
}
function playUrl(url){
  ensureAC();
  const a = new Audio(url); a.crossOrigin = 'anonymous';
  AC.createMediaElementSource(a).connect(outA);
  a.onplay = () => { playing = true; setMode('speaking'); };
  a.onended = a.onerror = () => { playing = false; setMode('idle'); cap(text_(), 3000); };
  window._a = a; a.play();
}
const text_ = () => $('#cap').textContent;
function speakText(text){
  if (!window.speechSynthesis){ setMode('idle'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => setMode('speaking');
  u.onboundary = () => { ext = .55 + Math.random() * .4; lastExt = performance.now(); };
  u.onend = u.onerror = () => { setMode('idle'); cap(text, 3000); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function cancelAll(){
  if (abort) abort.abort();
  stopMic(); playing = false;
  if (window._a){ window._a.pause(); window._a = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'cancel'}));
  setMode('idle'); cap('', 1); $('#cap').classList.remove('on');
}

/* ---------- keys ---------- */
addEventListener('keydown', ev => {
  if (ev.key === 'Tab'){
    ev.preventDefault();
    if (mode === 'listening'){ if (rec) rec.stop(); else { stopMic(); setMode('idle'); } }
    else { if (mode === 'speaking') cancelAll(); startMic(); }
  } else if (ev.key === 'Escape') cancelAll();
});
$('#in').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.value.trim()){ const v = ev.target.value.trim(); ev.target.value = ''; ask(v); }
});

/* ---------- public api ---------- */
window.Ultron = {
  setMode, ask, reply, stats, log, act, cancelAll, config: CONFIG,
  level: v => { ext = Math.max(ext, v); lastExt = performance.now(); },
  workspace: items => { $('#ws').textContent = items.join('\n'); },
  skills: items => { $('#sk').textContent = items.join('\n') || 'none loaded'; }
};

connect(); act('ULTRON core online');
requestAnimationFrame(frame);
</script>
</body>
</html>
